<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280">
  <title>Range assignment of six partitions</title>
  <rect width="960" height="280" fill="#f8fafc"/>
  <text x="32" y="36" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Range assignment</text>
  <text x="32" y="58" fill="#475569" font-family="sans-serif" font-size="13">Six partitions, two members of lab-consumer. Kafka gives each member a contiguous block.</text>

  <text x="32" y="100" fill="#1d4ed8" font-family="sans-serif" font-size="13" font-weight="700">Member that sorts first</text>
  <rect x="32" y="114" width="120" height="78" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="92" y="148" text-anchor="middle" fill="#1e3a8a" font-family="monospace" font-size="20" font-weight="700">0</text>
  <text x="92" y="170" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="12">partition</text>
  <rect x="164" y="114" width="120" height="78" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="224" y="148" text-anchor="middle" fill="#1e3a8a" font-family="monospace" font-size="20" font-weight="700">1</text>
  <text x="224" y="170" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="12">partition</text>
  <rect x="296" y="114" width="120" height="78" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="356" y="148" text-anchor="middle" fill="#1e3a8a" font-family="monospace" font-size="20" font-weight="700">2</text>
  <text x="356" y="170" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="12">partition</text>

  <text x="500" y="100" fill="#c2410c" font-family="sans-serif" font-size="13" font-weight="700">Member that sorts second</text>
  <rect x="500" y="114" width="120" height="78" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="560" y="148" text-anchor="middle" fill="#9a3412" font-family="monospace" font-size="20" font-weight="700">3</text>
  <text x="560" y="170" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12">partition</text>
  <rect x="632" y="114" width="120" height="78" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="692" y="148" text-anchor="middle" fill="#9a3412" font-family="monospace" font-size="20" font-weight="700">4</text>
  <text x="692" y="170" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12">partition</text>
  <rect x="764" y="114" width="120" height="78" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="824" y="148" text-anchor="middle" fill="#9a3412" font-family="monospace" font-size="20" font-weight="700">5</text>
  <text x="824" y="170" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12">partition</text>

  <text x="32" y="232" fill="#334155" font-family="sans-serif" font-size="13">In the lab run, c2 joined first and received 0-2. c1 received 3-5. The -name flag is a log label.</text>
  <text x="32" y="254" fill="#334155" font-family="sans-serif" font-size="13">One member alone is assigned 0-5. That is the rebalance you see when the other process leaves.</text>
</svg>
