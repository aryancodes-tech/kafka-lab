<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <title>Round-robin produce path</title>
  <rect width="960" height="300" fill="#f8fafc"/>
  <text x="32" y="36" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Produce path</text>
  <text x="32" y="58" fill="#475569" font-family="sans-serif" font-size="13">One record per second. Round-robin walks partitions 0 through 5, then starts again.</text>

  <rect x="32" y="88" width="170" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="117" y="122" text-anchor="middle" fill="#1e3a8a" font-family="sans-serif" font-size="14" font-weight="700">Producer</text>
  <text x="117" y="146" text-anchor="middle" fill="#1e40af" font-family="monospace" font-size="12">msg-1 ... msg-n</text>

  <line x1="202" y1="132" x2="250" y2="132" stroke="#0f766e" stroke-width="2"/>
  <polygon points="258,132 248,127 248,137" fill="#0f766e"/>

  <rect x="258" y="88" width="200" height="88" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="358" y="122" text-anchor="middle" fill="#115e59" font-family="sans-serif" font-size="14" font-weight="700">Round-robin</text>
  <text x="358" y="146" text-anchor="middle" fill="#134e4a" font-family="monospace" font-size="12">(n - 1) mod 6</text>

  <line x1="458" y1="132" x2="506" y2="132" stroke="#0f766e" stroke-width="2"/>
  <polygon points="514,132 504,127 504,137" fill="#0f766e"/>

  <rect x="520" y="100" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="552" y="123" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="13">p0</text>
  <rect x="592" y="100" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="624" y="123" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="13">p1</text>
  <rect x="664" y="100" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="696" y="123" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="13">p2</text>
  <rect x="736" y="100" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="768" y="123" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="13">p3</text>
  <rect x="808" y="100" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="840" y="123" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="13">p4</text>
  <rect x="880" y="100" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="912" y="123" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="13">p5</text>

  <text x="32" y="220" fill="#334155" font-family="sans-serif" font-size="13">msg-1 lands on partition 0 at offset 0. msg-2 lands on partition 1 at offset 0. msg-7 returns to partition 0 at offset 1.</text>
  <text x="32" y="244" fill="#334155" font-family="sans-serif" font-size="13">A consumer that owns partitions 3-5 therefore sees msg-4, msg-5, msg-6, msg-10, and so on.</text>
  <text x="32" y="268" fill="#334155" font-family="sans-serif" font-size="13">The broker ack is WaitForLocal: the leader confirms the write. This lab stores one replica.</text>
</svg>
