<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <title>Kafka lab topology</title>
  <rect width="960" height="440" fill="#f8fafc"/>
  <text x="32" y="36" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Lab topology</text>
  <text x="32" y="58" fill="#475569" font-family="sans-serif" font-size="13">Clients outside Docker use the advertised address, not the container hostname.</text>

  <rect x="32" y="84" width="260" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="114" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700">This laptop</text>
  <rect x="52" y="136" width="220" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="68" y="166" fill="#1e3a8a" font-family="sans-serif" font-size="14" font-weight="700">Producer</text>
  <text x="68" y="190" fill="#1e40af" font-family="monospace" font-size="12">127.0.0.1:29092</text>
  <rect x="52" y="230" width="220" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="68" y="260" fill="#1e3a8a" font-family="sans-serif" font-size="14" font-weight="700">Kafka UI</text>
  <text x="68" y="284" fill="#1e40af" font-family="monospace" font-size="12">localhost:8082</text>
  <text x="52" y="340" fill="#475569" font-family="sans-serif" font-size="12">UI uses the Docker network:</text>
  <text x="52" y="360" fill="#475569" font-family="monospace" font-size="12">kafka:9095</text>

  <rect x="350" y="84" width="260" height="320" rx="12" fill="#ffffff" stroke="#0f766e"/>
  <text x="370" y="114" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700">Docker</text>
  <rect x="370" y="136" width="220" height="236" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="386" y="164" fill="#115e59" font-family="sans-serif" font-size="14" font-weight="700">kafka-lab</text>
  <text x="386" y="194" fill="#134e4a" font-family="monospace" font-size="12">PLAINTEXT :9095</text>
  <text x="386" y="212" fill="#64748b" font-family="sans-serif" font-size="11">for other containers</text>
  <text x="386" y="240" fill="#134e4a" font-family="monospace" font-size="12">EXTERNAL :29092</text>
  <text x="386" y="258" fill="#64748b" font-family="sans-serif" font-size="11">for host and LAN clients</text>
  <text x="386" y="286" fill="#134e4a" font-family="monospace" font-size="12">CONTROLLER :9093</text>
  <text x="386" y="304" fill="#64748b" font-family="sans-serif" font-size="11">KRaft quorum only</text>
  <text x="386" y="340" fill="#115e59" font-family="sans-serif" font-size="12">broker and controller</text>

  <rect x="668" y="84" width="260" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="688" y="114" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700">Other laptop</text>
  <rect x="688" y="136" width="220" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="704" y="166" fill="#9a3412" font-family="sans-serif" font-size="14" font-weight="700">Consumer c1</text>
  <text x="704" y="190" fill="#c2410c" font-family="monospace" font-size="12">partitions 3, 4, 5</text>
  <rect x="688" y="230" width="220" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="704" y="260" fill="#9a3412" font-family="sans-serif" font-size="14" font-weight="700">Consumer c2</text>
  <text x="704" y="284" fill="#c2410c" font-family="monospace" font-size="12">partitions 0, 1, 2</text>
  <text x="688" y="340" fill="#475569" font-family="sans-serif" font-size="12">Same group: lab-consumer.</text>
  <text x="688" y="360" fill="#475569" font-family="sans-serif" font-size="12">Kafka assigns the blocks.</text>

  <line x1="292" y1="175" x2="346" y2="175" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="346,175 336,170 336,180" fill="#1d4ed8"/>
  <line x1="668" y1="175" x2="614" y2="175" stroke="#c2410c" stroke-width="2"/>
  <polygon points="614,175 624,170 624,180" fill="#c2410c"/>
  <line x1="668" y1="269" x2="614" y2="269" stroke="#c2410c" stroke-width="2"/>
  <polygon points="614,269 624,264 624,274" fill="#c2410c"/>
</svg>
